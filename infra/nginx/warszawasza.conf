# Install on VPS: /etc/nginx/sites-available/warszawasza.conf
#   sudo ln -sf /etc/nginx/sites-available/warszawasza.conf /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d warszawasza.online -d www.warszawasza.online
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name warszawasza.online www.warszawasza.online;
    return 301 https://warszawasza.online$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name warszawasza.online;

    ssl_certificate /etc/letsencrypt/live/warszawasza.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/warszawasza.online/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.warszawasza.online;

    ssl_certificate /etc/letsencrypt/live/warszawasza.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/warszawasza.online/privkey.pem;

    return 301 https://warszawasza.online$request_uri;
}

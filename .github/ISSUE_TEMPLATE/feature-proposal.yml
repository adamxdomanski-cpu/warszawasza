name: Propozycja funkcji
description: Nowa funkcja lub zmiana UX — wymagany filtr produktowy
title: "[Feature] "
labels:
  - proposal
body:
  - type: markdown
    attributes:
      value: |
        **Filtr produktowy (bezkompromisowe „nie”).**

        Funkcja trafia do produktu tylko wtedy, gdy odpowiadasz **TAK** na **przynajmniej jedno** pytanie:

        1. Czy **bezpośrednio skraca drogę** do podjęcia działania?
        2. Czy **realnie zwiększa orientację** użytkownika w rzeczywistości?

        Oba **NIE** → parking / odrzucenie.

        **Interfejs vs kanał:** zmiana **struktury** 🎤/📍 wymaga silniejszego uzasadnienia niż nowe **dane wdrożenia** (słownik).

  - type: textarea
    id: problem
    attributes:
      label: Jaki problem w rzeczywistości?
      description: Konkretna sytuacja terenowa, nie „fajny feature”.
      placeholder: "Np. świadek na koncercie nie wie, gdzie zgłosić tłok przy wyjściu 5…"
    validations:
      required: true

  - type: textarea
    id: shortens-action
    attributes:
      label: (1) Czy skraca drogę do działania? Jak?
      placeholder: "Np. jeden tap zamiast formularza…"
    validations:
      required: true

  - type: textarea
    id: increases-orientation
    attributes:
      label: (2) Czy zwiększa orientację w rzeczywistości? Jak?
      placeholder: "Np. wskazuje najbliższe wyjście, nie ogólną mapę miasta…"
    validations:
      required: true

  - type: dropdown
    id: filter-result
    attributes:
      label: Werdykt filtra
      options:
        - "TAK — spełnione ≥1 kryterium → dalej"
        - "NIE — oba kryteria nie → odrzucam / parking"
    validations:
      required: true

  - type: dropdown
    id: layer-type
    attributes:
      label: Typ zmiany
      options:
        - "Słownik (nowe miejsca / dane wdrożenia)"
        - "Struktura interfejsu (🎤/📍, przepływ) — rzadko"
        - "Kanał (WWW / PWA / native adapter)"
        - "Warstwa operatora / techniczna (L2/L3)"
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Najmniejsza działająca wersja
      description: Jedna spirala — co dokładnie shipujemy w pierwszym PR?
    validations:
      required: true

  - type: checkboxes
    id: success-metric
    attributes:
      label: Metryka sukcesu
      options:
        - label: "Sukces = użytkownik rozumie i może schować telefon (nie time-on-screen)"
          required: true
